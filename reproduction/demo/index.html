<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>图像来源检测 · Frozen CLIP</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f1;color:#152c25;font:16px/1.65 Inter,"Noto Sans CJK SC",system-ui,sans-serif}
main{max-width:980px;margin:7vh auto;padding:24px}header{border-bottom:1px solid #9eafa4;padding-bottom:24px}
h1{font-size:clamp(32px,5vw,54px);letter-spacing:-.04em;line-height:1.16;margin:0 0 12px}p{margin:8px 0}.meta,small{color:#53675c}
section{display:grid;grid-template-columns:minmax(0,3fr) minmax(230px,2fr);gap:28px;margin-top:28px}
#previewBox{display:grid;place-items:center;min-height:260px;height:clamp(260px,42vh,430px);background:#e7ece4;border:1px dashed #889e8e;border-radius:8px;overflow:hidden}
#preview{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;min-height:0}
label{display:inline-block;margin:12px 0 6px;font-weight:650}input{max-width:100%}input::file-selector-button{background:#fff;border:1px solid #9aac9f;border-radius:5px;padding:8px 14px;margin-right:10px;cursor:pointer}
aside{background:white;padding:22px;border-radius:8px;align-self:start}h2{margin:0 0 18px;font-size:19px}#label{display:block;font-size:28px}output{display:block;font-size:30px;font-variant-numeric:tabular-nums}progress{width:100%;accent-color:#227359}small{display:block;margin-top:8px}
@media(max-width:650px){main{margin:0 auto;padding:24px 16px}section{grid-template-columns:1fr;gap:16px}}
</style>
<main><header><h1>图像来源检测</h1><p class="meta">Frozen CLIP ViT-L/14 · 本地单图检测</p></header>
<section><div><div id="previewBox"><span id="hint">上传图片后在这里预览</span><img id="preview" alt="待检测图片预览" hidden></div>
<label for="file">选择图片</label><br><input id="file" type="file" accept="image/jpeg,image/png"><small>JPEG / PNG · 最大 20 MiB，3200 万像素</small></div>
<aside aria-live="polite"><h2>检测结果</h2><p id="status">等待上传图片</p><div id="result" hidden><strong id="label"></strong><p>AI 生成概率（模型估计）</p><output id="score"></output><progress id="bar" max="1" aria-label="AI 生成概率"></progress><small>AI 生成概率达到 50% 时判为 AI 生成。压缩、模糊或缩放可能改变预测。</small></div></aside></section></main>
<script>
const el=id=>document.getElementById(id);
let revision=0, url;
el('file').onchange=async()=>{
 const current=++revision, file=el('file').files[0];
 el('result').hidden=true; el('preview').hidden=true; el('hint').hidden=false;
 if(url){URL.revokeObjectURL(url);url=null}
 if(!file){el('status').textContent='等待上传图片';return}
 if(file.size>20*1024*1024){el('status').textContent='文件超过 20 MiB，请重新选择。';return}
 el('status').textContent='正在检测…';
 try{
  const response=await fetch('/predict',{method:'POST',body:file});
  const data=await response.json(); if(current!==revision)return;
  if(!response.ok)throw Error(data.error||'检测失败，请重新选择图片。');
  url=URL.createObjectURL(file);el('preview').src=url;el('preview').hidden=false;el('hint').hidden=true;
  el('label').textContent=data.label==='Real'?'真实 · Real':'AI 生成 · AI-Generated';
  el('score').textContent=(data.ai_probability*100).toFixed(2)+'%';el('bar').value=data.ai_probability;
  el('status').textContent=file.name;el('result').hidden=false;
 }catch(err){if(current===revision)el('status').textContent=err.message}
};
</script></html>
